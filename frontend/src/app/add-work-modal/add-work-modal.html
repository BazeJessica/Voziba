<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-title">
        <h2>List Your Work or Handiwork</h2>
        <p>Showcase your craft and receive orders or bookings from local & nationwide consumers.</p>
      </div>
      <button class="btn-close" (click)="onClose()">&times;</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-row">
        <div class="form-group flex-1">
          <label>Handiwork Title *</label>
          <input type="text" [(ngModel)]="title" name="title" placeholder="e.g. Hand-Carved Oak Coffee Table" required />
        </div>

        <div class="form-group flex-1">
          <label>Creator / Business Name *</label>
          <input type="text" [(ngModel)]="creatorName" name="creatorName" placeholder="e.g. Master Woodcraft Studio" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Category *</label>
          <select [(ngModel)]="category" name="category" required>
            @for (cat of categories; track cat.id) {
              <option [value]="cat.name">{{ cat.name }}</option>
            }
          </select>
        </div>

        <div class="form-group flex-1">
          <label>Location / City *</label>
          <input type="text" [(ngModel)]="location" name="location" placeholder="e.g. Seattle, WA" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Price ($ USD) *</label>
          <input type="number" [(ngModel)]="price" name="price" placeholder="e.g. 250" min="1" required />
        </div>

        <div class="form-group flex-1">
          <label>Pricing Structure</label>
          <select [(ngModel)]="priceType" name="priceType">
            <option value="fixed">Fixed Price</option>
            <option value="starting">Starting From</option>
            <option value="hourly">Hourly Rate</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label>Turnaround Time</label>
          <input type="text" [(ngModel)]="turnaround" name="turnaround" placeholder="e.g. 3 - 5 business days" />
        </div>
      </div>

      <div class="form-group">
        <label>Work Image URL</label>
        <input type="url" [(ngModel)]="img" name="img" placeholder="https://images.unsplash.com/..." />
      </div>

      <div class="form-group">
        <label>Description & Materials *</label>
        <textarea [(ngModel)]="description" name="description" rows="3" placeholder="Describe the materials, craftsmanship process, custom options, and specifications..." required></textarea>
      </div>

      <div class="form-group">
        <label>Tags (Comma separated)</label>
        <input type="text" [(ngModel)]="tagsInput" name="tagsInput" placeholder="e.g. Solid Wood, Custom Order, Handcrafted, Eco-friendly" />
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-submit">Publish Handiwork</button>
      </div>
    </form>
  </div>
</div>
