<div class="nav-container">
  <a routerLink="/" class="logo-brand">
    <div class="logo-icon">V</div>
    <div class="brand-name">Voz<span>iba</span></div>
  </a>

  <nav class="nav">
    <ul class="nav-links" [class.open]="menuOpen">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/#categories" (click)="closeMenu()">Categories</a></li>
      <li><a routerLink="/#works" (click)="closeMenu()">Browse Handiworks</a></li>
      <li><a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">My Profile</a></li>
      <li><a routerLink="/business-dashboard" routerLinkActive="active" (click)="closeMenu()">Business Orders</a></li>
    </ul>
  </nav>

  <div class="nav-right">
    <a routerLink="/login" class="nav-auth-btn login-btn" routerLinkActive="auth-active" title="Log In to your Account">
      Log In
    </a>
    <a routerLink="/signup" class="nav-auth-btn signup-btn" routerLinkActive="auth-active" title="Create New Account">
      Sign Up
    </a>

    <a routerLink="/admin" class="admin-portal-btn" routerLinkActive="admin-active" title="Platform Admin Control Center">
      <mat-icon>admin_panel_settings</mat-icon> Admin
    </a>
    <a routerLink="/business-dashboard" class="biz-dash-btn" routerLinkActive="biz-active" title="Business Owner Portal">
      <mat-icon>storefront</mat-icon> Business Dashboard
    </a>
    <a routerLink="/profile" class="user-profile-btn" routerLinkActive="profile-active" title="My Consumer Profile">
      <img [src]="user().avatar" [alt]="user().name" class="nav-avatar" />
      <span class="user-name-abbr">{{ user().name.split(' ')[0] }}</span>
    </a>
    <button class="btn-list-work" (click)="onListWorkClick()">
      <span>+</span> List Your Work
    </button>
    <div class="menu-toggle" (click)="toggleMenu()">&#9776;</div>
  </div>
</div>
