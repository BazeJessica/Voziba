<div class="categories-grid">
  <button class="category-card" [class.active]="selectedCategory === 'All'" (click)="selectCategory('All')">
    <mat-icon class="category-icon">group_work</mat-icon>
    <div class="category-info">
      <h3>All Handiworks</h3>
      <p>Browse full catalog</p>
    </div>
  </button>

  @for (cat of categories; track cat.id) {
  <button class="category-card" [class.active]="selectedCategory === cat.name" (click)="selectCategory(cat.name)">
    <mat-icon class="category-icon">{{ cat.icon }}</mat-icon>
    <div class="category-info">
      <h3>{{ cat.name }}</h3>
      <p>{{ cat.description }}</p>
    </div>
    <div class="category-badge">{{ cat.itemCount }} listings</div>
  </button>
  }
</div>
